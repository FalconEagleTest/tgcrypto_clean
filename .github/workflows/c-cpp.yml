name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set-info.outputs.release_tag }}
      release_name: ${{ steps.set-info.outputs.release_name }}
    steps:
      - name: Set release info
        id: set-info
        run: |
          echo "release_tag=v$(date +'%Y%m%d.%H%M')" >> $GITHUB_OUTPUT
          echo "release_name=Release $(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Build Windows
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build . --config Release
          
      - name: Release Windows
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/Release/tgcrypto.pyd"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.prepare-release.outputs.release_tag }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          body: ${{ inputs.release_notes }}
          
  build-android:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
        include:
          - abi: arm64-v8a
            android_abi: arm64-v8a
            android_arch: aarch64
          - abi: armeabi-v7a
            android_abi: armeabi-v7a
            android_arch: armv7a
            
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          
      - name: Build Android
        env:
          ANDROID_ABI: ${{ matrix.android_abi }}
          ANDROID_ARCH: ${{ matrix.android_arch }}
        run: |
          mkdir -p build-android/${{ matrix.abi }}
          cd build-android/${{ matrix.abi }}
          cmake ../.. \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.android_abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build .
          # Make a copy with ABI in name for release
          cp tgcrypto.so tgcrypto-${{ matrix.abi }}.so
          
      - name: Release Android
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build-android/${{ matrix.abi }}/tgcrypto-${{ matrix.abi }}.so"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.prepare-release.outputs.release_tag }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          body: ${{ inputs.release_notes }}
